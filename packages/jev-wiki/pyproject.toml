[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-wiki"
version = "0.1.0"
description = "Source-backed Markdown memory with bounded JEV decisions"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
# Local embedding candidates for recall; enable with JEV_WIKI_EMBEDDING_MODEL.
embed = ["model2vec>=0.4"]

[project.scripts]
jev-wiki = "jev_wiki.cli:main"

[tool.setuptools.packages.find]
include = ["jev_wiki*"]

[tool.ruff]
line-length = 100
target-version = "py310"
